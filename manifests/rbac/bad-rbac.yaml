apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: bad-role
rules:
- apiGroups: ["*"]
  resources: ["*"]
  verbs: ["*"]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: attacker-sa
  namespace: attacker
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: bad-role-binding
subjects:
- kind: ServiceAccount
  name: attacker-sa
  namespace: attacker
roleRef:
  kind: ClusterRole
  name: bad-role
  apiGroup: rbac.authorization.k8s.io